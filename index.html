<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vita Plena</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="A Catholic household's rule of life. The house keeps the hours.">
<meta name="theme-color" content="#3E7A55">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vita Plena">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>

<div id="loading"><div class="spin"></div>Fiat voluntas tua…</div>

<!-- Sign-in gate and onboarding are rendered by src/app/gate.js and src/app/onboarding.js -->
<div id="gate" class="gate hide"></div>
<div id="onboard" class="ob hide"></div>

<!-- App shell: liturgical band, header, pages, tab bar. Rendered by src/app/shell.js -->
<div class="litband"></div>
<header class="hdr hide" id="hdr"></header>
<main id="app" class="hide">
  <section class="page on" id="page-today"></section>
  <section class="page" id="page-pray"></section>
  <section class="page" id="page-calendar"></section>
  <section class="page" id="page-tasks"></section>
  <section class="page" id="page-us"></section>
  <section class="page" id="page-more"></section>
</main>
<nav class="tabbar hide" id="tabbar"></nav>

<!-- Family mode: the big-text counter screen. Rendered by src/screens/family.js -->
<div id="family" class="family hide"></div>

<!-- Bottom sheet: prayers, Beacon, menus -->
<div class="sheet" id="sheet">
  <div class="panel">
    <!-- The bar is a sibling of the scroller, not floating over it: it stays put
         while the reading scrolls, and it sits below the notch on every phone. -->
    <div class="s-head">
      <div class="grab"></div>
      <button class="s-back" onclick="A.closeSheet()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span>Done</span>
      </button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- Modal: small forms and confirmations -->
<div class="modal" id="modal"><div class="box" id="modal-body"></div></div>

<!-- The bell: shown when a practice's hour arrives while the app is open -->
<div class="bell-ov" id="bell"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
