# Vita Plena — Netlify configuration
# Build: Vite compiles index.html + src/ into dist/. Functions are bundled from
# netlify/functions with esbuild and can use dependencies from package.json.
# Branch deploys of the v5 build run alongside production (main) at
#   https://<branch-name>--vitaplena13.netlify.app

[build]
  command = "node scripts/build-lectionary.mjs; npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The service worker must be re-checked on every load, or a device could keep an
# old build for a day. The manifest carries its own type for the install prompt.
# Hashed build assets never change under one name, so they may be kept for a year.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app: every path serves index.html; the app routes client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
