# Vita Plena — continuous integration
# Runs on every push and pull request: install, typecheck, unit tests, production build.
# checkJs is on in jsconfig.json, so the typecheck is the thing that catches a bad
# property or a wrong argument before it ships.
# A red run here means the change is not deployable; Netlify builds the same way.
name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
